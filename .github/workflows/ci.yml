name: ci

# Runs on pull requests and on the three long-lived branches. Nothing here
# reads a secret or writes anywhere, so pull requests from forks run it with
# the same read-only token as everyone else.
on:
  pull_request:
  push:
    branches: [development, staging, main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Naming bash makes Actions add -o pipefail, which the implicit default
# (bash -e) leaves out, so a failure on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  npm_config_update_notifier: "false"

jobs:
  # Path filters live here rather than on the trigger: a skipped job reports
  # as passed, while a workflow that never starts leaves its checks pending.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      package: ${{ steps.changes.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Work out what changed
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE_SHA:-$PUSH_BEFORE}"
          case "$base" in *[!0]*) ;; *) base="" ;; esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # No reliable base: check everything.
            printf 'package=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only --no-renames "$base...HEAD")
          # The jobs below read every file except the shared review, audit
          # and security tooling under .github/, which lint and format skip
          # and security.yml checks. So any change outside .github/, or to
          # this workflow, runs them. grep exit 1 is "no such file"; any
          # other status fails the step rather than skipping the checks.
          status=0
          grep -qEv '^\.github/|^$' <<<"$files" || status=$?
          if [ "$status" -eq 1 ]; then
            status=0
            grep -qx '\.github/workflows/ci\.yml' <<<"$files" || status=$?
          fi
          case "$status" in
            0) package=true ;;
            1) package=false ;;
            *) echo "grep failed (exit $status) on the changed files" >&2; exit 1 ;;
          esac
          printf 'package=%s\n' "$package" >> "$GITHUB_OUTPUT"

  # No path filter: pins live under .github/, which the filter above skips,
  # and the scratch repository tests guard every git hook run.
  repo-checks:
    name: repo-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Every action pinned to a full SHA with its version
        run: bash scripts/check-pins.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The coverage test inside it runs vitest, so the install is needed.
      - name: Set up pnpm
        id: pnpm
        run: |
          corepack enable pnpm
          want=$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')
          got=$(pnpm --version)
          if [ "$got" != "$want" ]; then
            echo "pnpm $got is running, package.json pins $want" >&2
            exit 1
          fi
          store=$(pnpm store path --silent)
          echo "store=$store" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Scratch repository tests leave a decoy GIT_DIR alone
        run: bash scripts/tests/git_env_test.sh

  verify:
    name: verify
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Full history: the coverage baseline is compared with the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Corepack downloads the pnpm in packageManager and refuses it unless
      # it matches the sha512 pinned there.
      - name: Set up pnpm
        id: pnpm
        run: |
          corepack enable pnpm
          want=$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')
          got=$(pnpm --version)
          if [ "$got" != "$want" ]; then
            echo "pnpm $got is running, package.json pins $want" >&2
            exit 1
          fi
          store=$(pnpm store path --silent)
          echo "store=$store" >> "$GITHUB_OUTPUT"
      # pnpm checks each package's integrity as it links it, so a restored
      # store only saves download time.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm exec eslint . --max-warnings 0
      - name: Format
        run: pnpm exec prettier --check .
      - name: Tests with coverage
        run: pnpm exec vitest run --coverage
      - name: Coverage baseline does not fall
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/check-coverage-baseline.mjs "${PR_BASE_SHA:-$PUSH_BEFORE}"
      - name: Script tests
        run: |
          node --test scripts/tests/*.test.mjs
          bash scripts/tests/ci_filter_test.sh
          bash scripts/tests/pins_test.sh

  package:
    name: package
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up pnpm
        id: pnpm
        run: |
          corepack enable pnpm
          want=$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')
          got=$(pnpm --version)
          if [ "$got" != "$want" ]; then
            echo "pnpm $got is running, package.json pins $want" >&2
            exit 1
          fi
          store=$(pnpm store path --silent)
          echo "store=$store" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: publint
        run: pnpm exec publint --strict
      - name: Are the types wrong
        run: pnpm exec attw --pack . --profile esm-only
      - name: Tarball contents
        run: bash scripts/tests/pack_test.sh
      - name: Install and import the tarball
        run: bash scripts/tests/consume_test.sh
      # pnpm has a built-in "docs" command that opens a browser and exits 0,
      # so the script has another name, and the output must exist afterwards.
      - name: API docs
        run: |
          rm -rf docs/api
          pnpm run docs:api
          if [ ! -f docs/api/README.md ]; then
            echo "typedoc wrote no docs/api/README.md" >&2
            exit 1
          fi
